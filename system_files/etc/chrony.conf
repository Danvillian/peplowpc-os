# PeplowPC OS time sync with NTS (authenticated time). A spoofed clock can make
# expired or revoked security certificates look valid; NTS prevents that.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ntppool1.time.nl iburst nts

# Only trust authenticated sources, and at least two of them agreeing.
authselectmode require
minsources 2

# Allow NTS to start on a machine whose clock is badly wrong (dead CMOS battery).
nocerttimecheck 1

driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
makestep 1.0 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony
