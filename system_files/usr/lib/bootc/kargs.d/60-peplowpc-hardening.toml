# PeplowPC OS kernel boot arguments. Applied by bootc at install and on every update.
# Costs a few percent of performance in exchange for blocking whole classes of memory attacks.
# See docs/SECURITY-BASELINE.md and DECISIONS D8.
kargs = [
  "init_on_alloc=1",
  "init_on_free=1",
  "slab_nomerge",
  "page_alloc.shuffle=1",
  "randomize_kstack_offset=on",
  "vsyscall=none",
  "debugfs=off",
]
