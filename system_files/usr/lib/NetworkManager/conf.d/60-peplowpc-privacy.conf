# PeplowPC OS network privacy.
[device]
# Use a random hardware (MAC) address while searching for Wi-Fi networks.
wifi.scan-rand-mac-address=yes

[connection]
# Each Wi-Fi network sees a different made-up MAC address, stable for that network
# (so home router settings and hotel logins keep working), unrelated to your real hardware.
wifi.cloned-mac-address=stable
# Do not announce this computer's name to every network it joins.
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
# IPv6 privacy addresses.
ipv6.ip6-privacy=2
# Old Windows-style name lookups on the local network: off (spoofable).
connection.llmnr=0
