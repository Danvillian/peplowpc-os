# PeplowPC OS: GNOME first-run setup customizations.
#
# GNOME Initial Setup's privacy page always starts with Location Services switched ON (hardcoded
# in gis-privacy-page.c) and saves whatever the user leaves it at, overriding the system default.
# Skipping the page keeps PeplowPC's default: location off until the user turns it on in
# Settings > Privacy. Verified against gnome-initial-setup source, 2026-11-06.
[pages]
skip=privacy;
