name: Build PeplowPC OS installer (ISO)

# Run by hand when you want a new installer. Installed systems update themselves from the
# signed image, so the ISO only needs rebuilding for installer fixes or a new Fedora release.
#
# builder = branded (default): PeplowPC-branded installer built from installer/Containerfile with
#           Fedora's image-builder ("generic-iso"). See docs/ARCHITECTURE.md, "Installer".
# builder = legacy: the older bootc-image-builder "anaconda-iso" (Fedora-looking installer).
#           Kept as a fallback while the branded installer is new.
on:
  workflow_dispatch:
    inputs:
      builder:
        description: "Installer type"
        type: choice
        options: [branded, legacy]
        default: branded

env:
  IMAGE_NAME: peplowpc-os
  IMAGE_TAG: stable
  FEDORA_VERSION: "45"
  IB_IMAGE: ghcr.io/osbuild/image-builder-cli:latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Pull and verify the signed image
        id: img
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${IMAGE_TAG}"
          cosign verify --key keys/cosign.pub "$image" >/dev/null
          for i in 1 2 3 4 5; do sudo podman pull "$image" && break; echo "Retry $i"; sleep 20; done
          sudo podman image exists "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- branded installer
      - name: Build the branded installer image
        if: inputs.builder == 'branded'
        run: |
          for i in 1 2 3; do
            sudo podman build --pull=newer \
              --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
              --build-arg PAYLOAD_REF="${{ steps.img.outputs.image }}" \
              -t localhost/peplowpc-installer:latest \
              -f installer/Containerfile . && exit 0
            echo "Build attempt $i failed, retrying in 30 seconds"; sleep 30
          done
          exit 1

      - name: Pull image-builder (retries on network errors)
        if: inputs.builder == 'branded'
        run: |
          for i in 1 2 3 4 5; do
            sudo podman pull "${IB_IMAGE}" && exit 0
            echo "Pull failed (attempt $i), retrying in 20 seconds"; sleep 20
          done
          exit 1

      - name: Build branded ISO
        if: inputs.builder == 'branded'
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./output:/output \
            "${IB_IMAGE}" \
            build \
            --bootc-ref localhost/peplowpc-installer:latest \
            --bootc-installer-payload-ref "${{ steps.img.outputs.image }}" \
            --bootc-default-fs ext4 \
            --output-dir /output \
            generic-iso

      # ---------------------------------------------------------------- legacy installer
      - name: Point the legacy installer config at this repo's image
        if: inputs.builder == 'legacy'
        run: |
          sed -i "s|ghcr.io/danvillian/peplowpc-os:stable|${{ steps.img.outputs.image }}|g" disk_config/iso.toml

      - name: Pull bootc-image-builder (retries on network errors)
        if: inputs.builder == 'legacy'
        run: |
          for i in 1 2 3 4 5; do
            sudo podman pull "${BIB_IMAGE}" && exit 0
            echo "Pull failed (attempt $i), retrying in 20 seconds"; sleep 20
          done
          exit 1

      - name: Build legacy ISO
        if: inputs.builder == 'legacy'
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v ./disk_config/iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type anaconda-iso \
            --rootfs btrfs \
            "${{ steps.img.outputs.image }}"

      # ---------------------------------------------------------------- package
      - name: Name and checksum the ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f | head -20
          iso="$(find output -name '*.iso' | head -n1)"
          [[ -n "$iso" ]] || { echo "::error::No ISO produced"; exit 1; }
          suffix=""
          [[ "${{ inputs.builder }}" == legacy ]] && suffix="-legacy"
          mv "$iso" "output/PeplowPC-OS-$(date -u +%Y%m%d)${suffix}.iso"
          (cd output && sha256sum ./*.iso > SHA256SUMS)
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: peplowpc-os-iso-${{ inputs.builder }}
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 7
          compression-level: 0
