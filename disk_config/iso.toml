# PeplowPC OS installer (bootc-image-builder, --type anaconda-iso)
#
# The installer asks only about the disk, with encryption on by default (it asks for the passphrase).
# Language, time zone and the user account are handled on first boot by GNOME's own
# setup screens, which are friendlier for non-technical people.
#
# The image reference below is replaced by build-iso.yml with this repo's image.
# After install, peplowpc-signed-switch.service turns on signature checking for updates.

[customizations.installer.kickstart]
contents = """
# Encrypt the disk by default (DECISIONS D7). No passphrase is stored here: the installer asks for one
# on the disk screen. No clearpart, so existing data on the disk is never wiped without the user choosing it.
autopart --type=btrfs --encrypted --luks-version=luks2

# Leave the firewall exactly as the image ships it. Without this, Anaconda adds SSH to the
# default zone during every install (seen in /var/log/anaconda/syslog, 2026-11-06).
firewall --use-system-defaults

%post --log=/root/peplowpc-post.log
echo "Installed from ghcr.io/danvillian/peplowpc-os:stable"
# Backup for the firewall line above: if the installer still wrote its own copy of our zone
# (with SSH added), delete it so the zone from the image applies, and future image updates to
# the zone take effect too. PeplowPC OS ships no /etc copy of this file.
rm -fv /etc/firewalld/zones/peplowpc.xml /etc/firewalld/zones/peplowpc.xml.old
firewall-offline-cmd --zone=peplowpc --list-services
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
