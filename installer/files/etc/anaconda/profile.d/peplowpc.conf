# Anaconda profile for the PeplowPC OS installer.
# Selected by VARIANT_ID=peplowpc-installer in the installer's os-release.

[Profile]
profile_id = peplowpc
base_profile = fedora-silverblue

[Profile Detection]
os_id = fedora
variant_id = peplowpc-installer

[Bootloader]
# Boot settings Anaconda copies from the installer into the installed system. Same as Anaconda's
# default list minus "selinux" and "console": the installer runs with selinux=0 (Fedora's recipe),
# and copying that would switch SELinux off on every PeplowPC OS install (found in testing 2026-11-06).
preserved_arguments =
    cio_ignore zfcp.allow_lun_scan
    speakup_synth apic noapic apm ide noht acpi video
    pci nodmraid nompath nomodeset noiswmd fips
    biosdevname ipv6.disable net.ifnames net.ifnames.prefix
    nosmt vga rd.net.dns rd.net.dns-resolve-mode rd.net.dns-backend
    clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/peplowpc/peplowpc.css
# Account, network and time zone are set on first boot by GNOME's own setup screens.
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
    UserSpoke
    DatetimeSpoke
hidden_webui_pages =
    anaconda-screen-accounts
    anaconda-screen-date-time
    anaconda-screen-network
