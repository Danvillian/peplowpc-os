# Anaconda profile for the PeplowPC OS installer.
# Selected by VARIANT_ID=peplowpc-installer in the installer's os-release.

[Profile]
profile_id = peplowpc
base_profile = fedora-silverblue

[Profile Detection]
os_id = fedora
variant_id = peplowpc-installer

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/peplowpc/peplowpc.css
# Account, network and time zone are set on first boot by GNOME's own setup screens.
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
    UserSpoke
    DatetimeSpoke
hidden_webui_pages =
    anaconda-screen-accounts
    anaconda-screen-date-time
    anaconda-screen-network
